id = "houser.claude-usage"
name = "Claude Usage"
version = "0.2.1"
min_herdr_version = "0.7.0"
description = "Claude plan usage gauges on every space row (Session/Week %, color escalation, countdown to reset when a limit is exhausted). Multi-account aware: workspaces show the Claude profile their panes actually run. The exact numbers Claude Code shows in /status."
platforms = ["macos", "linux"]

# The monitor is a background process: it dies with the herdr server it talks to.
# Restored panes emit no pane.created, so after a server restart the event hooks
# below never fire - this runs ensure once as soon as the plugin is loaded.
[[startup]]
command = ["python3", "monitor.py", "ensure"]

[[actions]]
id = "start"
title = "Claude usage: start monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "ensure"]

[[actions]]
id = "stop"
title = "Claude usage: stop monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "stop"]

# Auto-start the monitor whenever the session produces activity,
# so it survives herdr server restarts without manual action.
[[events]]
on = "workspace.created"
command = ["python3", "monitor.py", "ensure"]

[[events]]
on = "pane.created"
command = ["python3", "monitor.py", "ensure"]

[[panes]]
id = "usage"
title = "Claude usage"
placement = "popup"
width = "70%"
height = "45%"
command = ["python3", "monitor.py", "popup"]
